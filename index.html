<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi P2P Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .top-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .main-workspace {
            display: flex;
            width: 100%;
            max-width: 900px;
            flex: 1;
            gap: 10px;
            min-height: 0;
        }
        .video-container {
            flex: 2;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .chat-section {
            flex: 1;
            background: #222;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            font-size: 12px;
            background: #181818;
        }
        .chat-input-area {
            display: flex;
            padding: 8px;
            background: #2a2a2a;
        }
        .chat-input-area input { flex: 1; padding: 6px; background: #111; color: white; border: 1px solid #555; }
        .chat-input-area button { background: #007bff; margin-left: 4px; }
    </style>
</head>
<body>

    <div class="top-panel" id="panel-pemilihan">
        <span><strong>Pilih Masuk:</strong></span>
        <button id="btn-vc-1" style="background: #28a745;">VC: 3Nberadik</button>
        <button id="btn-vc-2" style="background: #17a2b8;">VC: 3Nkandung</button>
        <button id="btn-chat-1" style="background: #ffc107; color:#000;">Chat: 3Nberadik</button>
        <button id="btn-chat-2" style="background: #ffc107; color:#000;">Chat: 3Nkandung</button>
    </div>

    <div class="top-panel" id="panel-kontrol" style="display:none;">
        <span>ID Anda: <strong id="my-id">-</strong></span>
        <span>Lawan: <strong id="target-id-display">-</strong></span>
        <button id="hangup-btn" style="background:#dc3545;">Keluar</button>
    </div>

    <div class="main-workspace">
        <div class="video-container" id="video-box">
            <video id="main-video" autoplay playsinline></video>
        </div>

        <div class="chat-section" id="chat-section">
            <div style="background: #007bff; padding: 8px; font-weight: bold; font-size: 12px;">Chat Room</div>
            <div class="chat-messages" id="chat-messages">Belum ada pesan</div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ketik pesan...">
                <button id="send-chat-btn">Kirim</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
