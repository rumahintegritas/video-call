<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi P2P Responsif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .top-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 5px;
            margin-bottom: 5px;
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 11px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 950px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        button {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        
        /* Workspace Utama */
        .main-workspace {
            display: flex;
            width: 100%;
            max-width: 950px;
            flex: 1;
            gap: 8px;
            min-height: 0;
            padding-bottom: 5px;
            flex-direction: row;
            box-sizing: border-box;
        }
        
        .video-container {
            flex: 1.5;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 150px;
        }
        .video-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }
        
        /* Video Kecil Mengambang (PiP) */
        .video-floating {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 80px;
            height: 110px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            z-index: 5;
        }
        .video-floating video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 2px;
            left: 3px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1px 3px;
            font-size: 8px;
            border-radius: 3px;
        }

        /* Tombol Kontrol Mengambang */
        .floating-controls {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.75);
            padding: 4px 8px;
            border-radius: 20px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        .media-btn { background-color: #444; font-size: 10px; padding: 4px 6px; }
        .media-btn.active { background-color: #dc3545; }

        /* Panel Chat */
        .chat-section {
            flex: 1;
            background: #222;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 180px;
        }
        .chat-messages {
            flex: 1;
            padding: 6px;
            overflow-y: auto;
            font-size: 11px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 6px;
            word-break: break-all;
        }
        .chat-bubble {
            max-width: 80%;
            padding: 5px 8px;
            border-radius: 8px;
            word-break: break-word;
            line-height: 1.3;
        }
        .chat-bubble.mine {
            background-color: #005c4b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-bubble.theirs {
            background-color: #333333;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 5px;
            background: #2a2a2a;
            flex-shrink: 0;
        }
        .chat-input-area input { flex: 1; padding: 5px; background: #111; color: white; border: 1px solid #555; border-radius: 4px; font-size: 11px; min-width: 0; }
        .chat-input-area button { background: #007bff; margin-left: 4px; padding: 5px 8px; font-size: 11px; }

        @media (max-width: 768px) {
            body { padding: 2px; }
            .main-workspace { flex-direction: column; }
            .video-container { flex: 1.2; min-height: 160px; }
            .chat-section { flex: 1; min-height: 120px; }
            .video-floating { width: 70px; height: 95px; }
            .floating-controls { bottom: 4px; padding: 3px 6px; gap: 3px; }
            .media-btn { font-size: 9px; padding: 3px 5px; }
        }
    </style>
</head>
<body>

    <!-- Panel Pemilihan Mode di Awal -->
    <div class="top-panel" id="panel-pemilihan">
        <span><strong>Pilih Mode Masuk:</strong></span>
        <button id="btn-vc" style="background: #28a745;">Buat Ruang Video Call</button>
        <button id="btn-chat" style="background: #ffc107; color:#000;">Buat Ruang Chat Saja</button>
    </div>

    <!-- Panel Kontrol Setelah Masuk (Menampilkan Tombol Salin Tautan) -->
    <div class="top-panel" id="panel-kontrol" style="display:none;">
        <span>Status: <strong id="status-koneksi" style="color: #ffc107;">Membuat Ruang...</strong></span>
        <button id="copy-link-btn" style="background: #17a2b8;">Salin Tautan Ruang</button>
        <button id="hangup-btn" style="background:#dc3545;">Keluar</button>
    </div>

    <div class="main-workspace">
        <div class="video-container" id="video-box">
            <video id="main-video" class="video-main" autoplay playsinline></video>
            
            <div class="video-floating" id="floating-box" onclick="tukarPosisiVideo()" title="Klik tukar posisi">
                <video id="floating-video" autoplay muted playsinline></video>
                <div class="video-label" id="floating-label">Anda</div>
            </div>

            <div class="floating-controls" id="video-controls" style="display:none;">
                <button id="mute-btn" class="media-btn">Mute</button>
                <button id="camera-btn" class="media-btn">Matikan Kamera</button>
                <button id="switch-camera-btn" class="media-btn">Putar HP</button>
            </div>
        </div>

        <div class="chat-section" id="chat-section">
            <div style="background: #007bff; padding: 4px 8px; font-weight: bold; font-size: 11px;">Chat Room</div>
            <div class="chat-messages" id="chat-messages">
                <div style="color: #777; text-align: center; font-size: 10px;">Belum ada pesan</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ketik pesan atau paste tautan...">
                <button id="send-chat-btn">Kirim</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
