<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi P2P Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .top-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 13px;
        }
        button {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .main-workspace {
            display: flex;
            width: 100%;
            max-width: 950px;
            flex: 1;
            gap: 10px;
            min-height: 0;
            padding-bottom: 5px;
        }
        
        /* Area Video Ala WhatsApp */
        .video-container {
            flex: 2;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }
        
        /* Video Kecil Mengambang (PiP) yang bisa diklik untuk tukar posisi */
        .video-floating {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 100px;
            height: 135px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            z-index: 5;
        }
        .video-floating video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 3px;
            left: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1px 4px;
            font-size: 9px;
            border-radius: 3px;
        }

        /* Tombol Kontrol Kamera Tambahan di Bawah Video */
        .floating-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 10;
        }
        .media-btn { background-color: #444; font-size: 11px; padding: 4px 8px; }

        /* Panel Chat Samping */
        .chat-section {
            flex: 1;
            background: #222;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-width: 280px;
        }
        .chat-messages {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            font-size: 12px;
            background: #181818;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-bubble {
            max-width: 80%;
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
            line-height: 1.4;
        }
        .chat-bubble.mine {
            background-color: #005c4b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-bubble.theirs {
            background-color: #333333;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 6px;
            background: #2a2a2a;
        }
        .chat-input-area input { flex: 1; padding: 6px; background: #111; color: white; border: 1px solid #555; border-radius: 4px; font-size: 11px; }
        .chat-input-area button { background: #007bff; margin-left: 4px; padding: 6px 10px; }
    </style>
</head>
<body>

    <div class="top-panel" id="panel-pemilihan">
        <span><strong>Pilih Masuk:</strong></span>
        <button id="btn-vc-1" style="background: #28a745;">VC: 3Nberadik</button>
        <button id="btn-vc-2" style="background: #17a2b8;">VC: 3Nkandung</button>
        <button id="btn-chat-1" style="background: #ffc107; color:#000;">Chat: 3Nberadik</button>
        <button id="btn-chat-2" style="background: #ffc107; color:#000;">Chat: 3Nkandung</button>
    </div>

    <div class="top-panel" id="panel-kontrol" style="display:none;">
        <span>ID Anda: <strong id="my-id">-</strong></span>
        <span>Lawan: <strong id="target-id-display">-</strong></span>
        <button id="hangup-btn" style="background:#dc3545;">Keluar</button>
    </div>

    <div class="main-workspace">
        <div class="video-container" id="video-box">
            <!-- Video Utama -->
            <video id="main-video" class="video-main" autoplay playsinline></video>
            
            <!-- Video Kecil Mengambang (Klik untuk tukar posisi besar/kecil) -->
            <div class="video-floating" id="floating-box" onclick="tukarPosisiVideo()" title="Klik untuk tukar posisi">
                <video id="floating-video" autoplay muted playsinline></video>
                <div class="video-label" id="floating-label">Anda</div>
            </div>

            <!-- Tombol Ganti Kamera Depan/Belakang -->
            <div class="floating-controls" id="video-controls" style="display:none;">
                <button id="switch-camera-btn" class="media-btn">Putar Kamera</button>
            </div>
        </div>

        <div class="chat-section" id="chat-section">
            <div style="background: #007bff; padding: 6px 8px; font-weight: bold; font-size: 12px;">Chat Room</div>
            <div class="chat-messages" id="chat-messages">
                <div style="color: #777; text-align: center; font-size: 11px;">Belum ada pesan</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ketik pesan...">
                <button id="send-chat-btn">Kirim</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
