<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Call Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        video {
            width: 48%;
            max-width: 500px;
            height: 360px;
            background-color: #333;
            border-radius: 8px;
            object-fit: cover;
        }
        .controls {
            margin-top: 20px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #cancel-btn {
            background-color: #dc3545;
            display: none; /* Sembunyikan default sebelum menelepon */
        }
        #cancel-btn:hover {
            background-color: #a71d2a;
        }
    </style>
</head>
<body>

    <h2>Aplikasi Video Call P2P</h2>
    
    <div>
        <p>ID Anda: <strong id="my-id">3Nberadik</strong></p>
    </div>

    <div class="controls">
        <input type="text" id="peer-id-input" placeholder="Masukkan ID Teman">
        <button id="call-btn">Panggil</button>
        <button id="cancel-btn">Batalkan / Tutup</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Video Anda</h3>
            <video id="local-video" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Video Lawan Bicara</h3>
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
