<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi P2P (Video, Suara, atau Chat)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 950px;
            margin-bottom: 4px;
        }
        h2 { margin: 2px 0; font-size: 15px; }
        #exit-btn {
            background-color: #dc3545;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .top-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
            margin-bottom: 6px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        #btn-vc-1 { background-color: #28a745; }
        #btn-vc-2 { background-color: #17a2b8; }
        #btn-chat-1 { background-color: #ffc107; color: #000; }
        #btn-chat-2 { background-color: #ffc107; color: #000; }

        /* Modal Panggilan Masuk */
        #incoming-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 280px;
        }
        .modal-btn-group { margin-top: 15px; display: flex; justify-content: space-around; }
        #accept-call-btn { background-color: #28a745; padding: 6px 12px; }
        #reject-call-btn { background-color: #dc3545; padding: 6px 12px; }

        /* Workspace Tata Letak */
        .main-workspace {
            display: flex;
            width: 100%;
            max-width: 950px;
            flex: 1;
            gap: 10px;
            min-height: 0;
            padding-bottom: 5px;
        }

        .video-container {
            flex: 2;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .video-container.hidden {
            display: none;
        }

        .video-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        .video-floating {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 100px;
            height: 135px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
            z-index: 5;
        }
        .video-floating video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 3px;
            left: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 1px 4px;
            font-size: 9px;
            border-radius: 3px;
        }

        .floating-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 10;
        }
        .media-btn { background-color: #444; }

        /* Panel Chat */
        .chat-section {
            flex: 1;
            min-width: 220px;
            background: #222;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }
        .chat-section.full-width {
            flex: 2;
            max-width: 100%;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .chat-messages {
            flex: 1;
            padding: 6px;
            overflow-y: auto;
            font-size: 11px;
            text-align: left;
            background: #181818;
            color: #ddd;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-msg { padding: 4px 6px; border-radius: 4px; max-width: 85%; word-break: break-word; }
        .chat-msg.mine { background: #005c4b; align-self: flex-end; color: white; }
        .chat-msg.theirs { background: #333; align-self: flex-start; color: white; }
        .chat-msg small { display: block; font-size: 8px; color: #aaa; margin-top: 1px; }
        .chat-input-area {
            display: flex;
            padding: 5px;
            background: #2a2a2a;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .chat-input-area input { flex: 1; padding: 4px; font-size: 11px; background: #111; color: white; border: 1px solid #555; border-radius: 4px; }
        .chat-input-area button { padding: 4px 8px; font-size: 11px; margin-left: 3px; background: #007bff; }
    </style>
</head>
<body>

    <div id="incoming-modal">
        <div class="modal-content">
            <h3 id="incoming-title">Panggilan Masuk!</h3>
            <p>Dari: <strong id="incoming-caller-id">...</strong></p>
            <div class="modal-btn-group">
                <button id="accept-call-btn">Terima</button>
                <button id="reject-call-btn">Tolak</button>
            </div>
        </div>
    </div>

    <div class="header-container">
        <h2>Aplikasi P2P (VC, Telepon, / Chat)</h2>
        <button id="exit-btn">Keluar</button>
    </div>
    
    <!-- Panel Pemilihan Mode -->
    <div class="top-panel" id="panel-pemilihan">
        <span><strong>Pilih Mode & Perangkat:</strong></span>
        <button id="btn-vc-1">VC: 3Nberadik</button>
        <button id="btn-vc-2">VC: 3Nkandung</button>
        <button id="btn-chat-1">Chat: 3Nberadik</button>
        <button id="btn-chat-2">Chat: 3Nkandung</button>
    </div>

    <!-- Panel Kontrol Setelah Masuk -->
    <div class="top-panel" id="panel-kontrol" style="display:none;">
        <span>ID Anda: <strong id="my-id">-</strong></span>
        <span>Lawan: <strong id="target-id-display">-</strong></span>
        <button id="call-video-btn" style="background:#28a745;">Panggil Video</button>
        <button id="call-audio-btn" style="background:#17a2b8;">Panggil Suara</button>
        <button id="hangup-btn" style="background:#dc3545; display:none;">Tutup</button>
    </div>

    <div class="main-workspace">
        <!-- Area Video -->
        <div class="video-container" id="video-container-box">
            <video id="main-video" class="video-main" autoplay playsinline></video>
            
            <div class="video-floating" id="floating-box" onclick="tukarPosisiVideo()" title="Klik tukar posisi">
                <video id="floating-video" autoplay muted playsinline></video>
                <div class="video-label" id="floating-label">Anda</div>
            </div>

            <div class="floating-controls">
                <button id="mute-btn" class="media-btn">Mute</button>
                <button id="camera-btn" class="media-btn">Kamera</button>
                <button id="switch-camera-btn" class="media-btn">Putar</button>
            </div>
        </div>

        <!-- Bagian Chat -->
        <div class="chat-section" id="chat-section">
            <div class="chat-header">Obrolan Pesan P2P</div>
            <div class="chat-body" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
                <div class="chat-messages" id="chat-messages">
                    <div style="color: #777; text-align: center; font-size: 10px;">Belum ada pesan</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Ketik pesan...">
                    <button id="send-chat-btn">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
