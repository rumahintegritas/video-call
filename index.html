<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Call Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 950px;
            margin: 0 auto 10px auto;
            padding: 0 10px;
        }
        #exit-btn {
            background-color: #343a40;
            font-size: 14px;
            padding: 8px 14px;
        }
        #exit-btn:hover {
            background-color: #23272b;
        }
        .video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .video-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        video {
            width: 100%;
            max-width: 450px;
            height: 340px;
            background-color: #333;
            border-radius: 8px;
            object-fit: cover;
        }
        .controls, .media-controls {
            margin-top: 15px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #cancel-btn {
            background-color: #dc3545;
            display: none;
        }
        #cancel-btn:hover {
            background-color: #a71d2a;
        }
        .media-btn {
            background-color: #6c757d;
            font-size: 14px;
            padding: 8px 12px;
        }
        .media-btn.active {
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>Aplikasi Video Call P2P</h2>
        <button id="exit-btn">Keluar Aplikasi</button>
    </div>
    
    <div>
        <p>ID Anda: <strong id="my-id">Menghubungkan...</strong></p>
    </div>

    <div class="controls">
        <input type="text" id="peer-id-input" placeholder="Masukkan ID Teman">
        <button id="call-btn">Panggil</button>
        <button id="cancel-btn">Tutup Panggilan</button>
    </div>

    <div class="video-container">
        <div class="video-box">
            <h3>Video Anda</h3>
            <video id="local-video" autoplay muted playsinline></video>
            <div class="media-controls">
                <button id="mute-btn" class="media-btn">Mute Suara</button>
                <button id="camera-btn" class="media-btn">Matikan Kamera</button>
            </div>
        </div>
        <div class="video-box">
            <h3>Video Lawan Bicara</h3>
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
