<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Panggilan P2P Gaya WhatsApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 5px;
            z-index: 10;
        }
        h2 { margin: 5px 0; font-size: 16px; }
        #exit-btn {
            background-color: #dc3545;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .top-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 13px;
            z-index: 10;
        }
        input, button {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: white;
        }
        button { background-color: #007bff; cursor: pointer; border: none; }
        #call-video-btn { background-color: #28a745; }
        #call-audio-btn { background-color: #17a2b8; }
        .media-btn { background-color: #444; }
        .media-btn.active { background-color: #dc3545; }

        /* Modal Panggilan Masuk */
        #incoming-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 280px;
        }
        .modal-btn-group { margin-top: 15px; display: flex; justify-content: space-around; }
        #accept-call-btn { background-color: #28a745; padding: 6px 12px; }
        #reject-call-btn { background-color: #dc3545; padding: 6px 12px; }

        /* Workspace Tata Letak ala WhatsApp */
        .main-workspace {
            display: flex;
            width: 100%;
            max-width: 900px;
            flex: 1;
            gap: 10px;
            position: relative;
            min-height: 0;
        }

        /* Area Video Utama (Layar Penuh / Background) */
        .video-container {
            flex: 2;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Utama yang sedang tampil besar */
        .video-main {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        /* Video Kecil yang Tumpang Tindih (Floating PiP) di Pojok */
        .video-floating {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 110px;
            height: 150px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s;
        }
        .video-floating:hover {
            transform: scale(1.05);
        }
        .video-floating video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 4px;
            left: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 1px 4px;
            font-size: 9px;
            border-radius: 3px;
        }

        /* Kontrol Video di Bagian Bawah Layar */
        .floating-controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 30px;
            z-index: 10;
        }

        /* Panel Chat Samping (Bisa Diminimize) */
        .chat-section {
            flex: 1;
            min-width: 220px;
            max-width: 260px;
            background: #222;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            transition: height 0.3s ease;
        }
        .chat-section.minimized {
            height: 34px;
            overflow: hidden;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        #toggle-chat-btn { background: none; border: none; color: white; font-size: 11px; cursor: pointer; }
        .chat-body { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .chat-section.minimized .chat-body { display: none; }
        .chat-messages {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            font-size: 11px;
            text-align: left;
            background: #181818;
            color: #ddd;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-msg { padding: 5px 8px; border-radius: 5px; max-width: 85%; word-break: break-word; }
        .chat-msg.mine { background: #005c4b; align-self: flex-end; color: white; }
        .chat-msg.theirs { background: #333; align-self: flex-start; color: white; }
        .chat-msg small { display: block; font-size: 8px; color: #aaa; margin-top: 1px; }
        .chat-input-area {
            display: flex;
            padding: 6px;
            background: #2a2a2a;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .chat-input-area input { flex: 1; padding: 5px; font-size: 11px; background: #111; color: white; }
        .chat-input-area button { padding: 5px 8px; font-size: 11px; margin-left: 3px; }
    </style>
</head>
<body>

    <div id="incoming-modal">
        <div class="modal-content">
            <h3>Panggilan Masuk!</h3>
            <p>Dari: <strong id="incoming-caller-id">...</strong></p>
            <div class="modal-btn-group">
                <button id="accept-call-btn">Terima</button>
                <button id="reject-call-btn">Tolak</button>
            </div>
        </div>
    </div>

    <div class="header-container">
        <h2>Aplikasi Panggilan P2P (Gaya WhatsApp)</h2>
        <button id="exit-btn">Keluar</button>
    </div>
    
    <div class="top-panel">
        <span>ID Anda: <strong id="my-id">Menghubungkan...</strong></span>
        <span>Lawan: <strong id="target-id-display">...</strong></span>
        <button id="call-video-btn">Panggil Video</button>
        <button id="call-audio-btn">Panggil Suara</button>
        <button id="hangup-btn" style="background-color: #dc3545; display:none;">Tutup</button>
    </div>

    <div class="main-workspace">
        <!-- Area Video Utama (Tampilan ala WhatsApp) -->
        <div class="video-container">
            <!-- Layar Utama (Secara default menampilkan lawan bicara jika ada, atau diri sendiri) -->
            <video id="main-video" class="video-main" autoplay playsinline></video>
            
            <!-- Layar Kecil Mengambang (Floating PiP) -->
            <div class="video-floating" id="floating-box" onclick="tukarPosisiVideo()" title="Klik untuk tukar posisi">
                <video id="floating-video" autoplay muted playsinline></video>
                <div class="video-label" id="floating-label">Anda</div>
            </div>

            <!-- Kontrol Mengambang di Bawah Video -->
            <div class="floating-controls">
                <button id="mute-btn" class="media-btn">Mute</button>
                <button id="camera-btn" class="media-btn">Kamera</button>
                <button id="switch-camera-btn" class="media-btn">Putar</button>
            </div>
        </div>

        <!-- Bagian Chat Samping -->
        <div class="chat-section" id="chat-section">
            <div class="chat-header" onclick="toggleChatMinimize()">
                <span>Obrolan Rapat</span>
                <button id="toggle-chat-btn">[-] Sembunyikan</button>
            </div>
            <div class="chat-body">
                <div class="chat-messages" id="chat-messages">
                    <div style="color: #777; text-align: center; font-size: 10px;">Belum ada pesan</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Ketik pesan...">
                    <button id="send-chat-btn">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
